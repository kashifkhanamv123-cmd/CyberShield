<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot | Elite Experience</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="pulse"></span>
                <h1>Gemini Assistant</h1>
            </div>
            <p class="subtitle">Next-generation AI conversations</p>
        </header>

        <main id="chat-container">
            <div class="message bot-message">
                Hello! I am your Gemini-powered assistant. How can I help you today?
            </div>
        </main>

        <footer>
            <form id="chat-form">
                <div class="input-wrapper">
                    <label for="image-input" id="upload-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z" />
                        </svg>
                    </label>
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                    <input type="text" id="user-input" placeholder="Type your message or ask about an image..." autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
                        </svg>
                    </button>
                </div>
                <div id="image-preview-container" style="display: none;">
                    <img id="image-preview" src="" alt="Preview">
                    <button type="button" id="remove-image-btn">&times;</button>
                </div>
            </form>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
